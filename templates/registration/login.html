{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width: 360px; margin: 3rem auto;">
    <h1>Log in</h1>
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
            <div class="error">Incorrect username or password.</div>
        {% endif %}
        <p>
            <label for="id_username">Username</label><br>
            <input type="text" name="username" id="id_username" autofocus required style="width:100%;padding:0.4rem;">
        </p>
        <p>
            <label for="id_password">Password</label><br>
            <input type="password" name="password" id="id_password" required style="width:100%;padding:0.4rem;">
        </p>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn" type="submit">Log in</button>
    </form>
</div>
{% endblock %}
